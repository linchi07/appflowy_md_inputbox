[package]
name = "flamingo_yffi"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["staticlib", "cdylib"]
# Compile the pinned official yffi implementation, without custom CRDT code.
path = "../vendor/y-crdt/yffi/src/lib.rs"

[dependencies]
yrs = { path = "../vendor/y-crdt/yrs", version = "=0.28.0", features = ["weak"] }
serde_json = "1"
